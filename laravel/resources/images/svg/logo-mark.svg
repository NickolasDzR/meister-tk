    <!--
    Дорога едет: разметка движется от горизонта к зрителю.
    Неподвижные штрихи (logo-road__static) видны, только когда анимация
    выключена — «уменьшить движение» в системе; тогда знак как в оригинале.
    Движущаяся часть: щель под штрихами закрыта цветом соседей (слева — левого,
    справа — правого), поверх — полосы внутри замеренного контура штрихов.
    Под полосами дорога тёмная до дна «М» (47,6), ниже бирюзовая: полосы
    идут по кромке бирюзового клина, клин начинается ровно у их правого края.
    Цвета нигде не лежат друг на друге: каждая закраска — только в своей
    области, иначе по краям областей нижний цвет просвечивал волосками.
    Закраски начинаются ниже верхнего края: там штрих упирается в скругления
    ноги «М», и закраска срезала их уголками.
    Стили и скорость — в modules/logo/logo.scss.
    -->
