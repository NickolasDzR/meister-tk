; PHP на боевом сервере. Отличия от php.ini: ошибки не показываются посетителям, включён opcache.
cgi.fix_pathinfo=0
memory_limit=256M
max_execution_time=60
max_input_time=60
upload_max_filesize=20M
post_max_size=20M
expose_php=Off

display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED

date.timezone=Europe/Moscow

; Код в образе не меняется, поэтому файлы не перепроверяются — новая версия приходит с новым образом
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
